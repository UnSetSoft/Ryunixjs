<!doctype html>
<html lang="<%= htmlWebpackPlugin.options.pageLang %>">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="framework"
      content="<%= htmlWebpackPlugin.options.info.framework %>"
      version="<%= htmlWebpackPlugin.options.info.version %>"
    />
    <meta name="mode" content="<%= htmlWebpackPlugin.options.info.mode %>" />
    <% if (htmlWebpackPlugin.options.styleFontLinks) { %> <%=
    htmlWebpackPlugin.options.styleFontLinks %> <% } %> <% if
    (htmlWebpackPlugin.options.styleVars) { %>
    <style>
      <%= htmlWebpackPlugin.options.styleVars %>
    </style>
    <% } %>
    <link rel="icon" href="/favicon.png" />
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <%= htmlWebpackPlugin.options.ssrScript %>

    <div id="__ryunix"></div>
  </body>
</html>
